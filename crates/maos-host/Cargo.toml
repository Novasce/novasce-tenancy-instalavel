[package]
name = "maos-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "As mãos diretas do Tenancy no host Linux: pseudoterminal, processos, git e cofre."

[lib]
name = "maos_host"
path = "src/lib.rs"

[[bin]]
name = "maos-host"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
