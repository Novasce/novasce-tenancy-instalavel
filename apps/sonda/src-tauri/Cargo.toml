[package]
name = "tenancy-sonda"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "tenancy_sonda"
path = "src/lib.rs"

[[bin]]
name = "tenancy-sonda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
