[package]
name = "tenancy"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tenancy_app"
path = "src/lib.rs"

[[bin]]
name = "novasce-tenancy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
